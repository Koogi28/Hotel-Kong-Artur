# Hele systemet starter med:  docker compose up --build
# Dev-containeren (Spec Kit + Claude Code) ligger i docker/docker-compose.yml bag profilen "dev":
#   docker compose --profile dev up -d app
name: hotel-kong-artur

include:
  - docker/docker-compose.yml

services:
  db:
    # PostgreSQL 16 (konstitution V, research R11)
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      # TZ bliver serverens standardtidszone ved første opstart. PGTZ gælder kun psql i containeren.
      # Backendens tidszone sættes på forbindelsen i backend/src/db.js.
      TZ: Europe/Copenhagen
      PGTZ: Europe/Copenhagen
    volumes:
      - pg_data:/var/lib/postgresql/data
      # Kører kun, når volumen er tom (første opstart)
      - ./db-init:/docker-entrypoint-initdb.d:ro
    # Ingen ports: databasen er kun tilgængelig for backend (princip IV, research R5)
    healthcheck:
      # Tjek via TCP (127.0.0.1): imagets midlertidige init-server lytter kun på socket, mens
      # db-init/*.sql kører. Så db bliver først "healthy", når seed er færdig (research R4 og R11).
      # $$ betyder, at compose ikke selv udfylder variablerne; det gør containerens shell.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
