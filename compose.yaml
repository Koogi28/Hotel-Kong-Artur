# Hele systemet starter med:  docker compose up --build
# Dev-containeren (Spec Kit + Claude Code) ligger i docker/docker-compose.yml bag profilen "dev":
#   docker compose --profile dev up -d app
name: hotel-kong-artur

include:
  - docker/docker-compose.yml

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: Europe/Copenhagen
    volumes:
      - mysql_data:/var/lib/mysql
      # Kører kun, når volumen er tom (første opstart)
      - ./db-init:/docker-entrypoint-initdb.d:ro
    # Ingen ports: databasen er kun tilgængelig for backend (princip IV, research R5)
    healthcheck:
      # Ping via TCP (127.0.0.1), så db ikke bliver "healthy" mens init-scripts kører (research R4)
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      MYSQL_HOST: db
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
