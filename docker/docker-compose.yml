name: hotel-kong-artur

# Inkluderes af compose.yaml i roden. db og backend ligger dér.
services:
  # Main Development Environment (Spec Kit + Claude Code)
  # Starter kun med profilen "dev":  docker compose --profile dev up -d app
  app:
    profiles: [dev]
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: hotel-kong-artur-dev:latest
    volumes:
      - ..:/workspace
      # Keep Claude Code login/settings across container rebuilds
      - claude_config:/home/dev/.claude
    # Passwords hentes fra .env i roden (stien er relativ til denne fil)
    env_file: ../.env
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: "3306"
    # Ingen depends_on: db, fordi en inkluderet fil ikke kan pege på services i compose.yaml (research R5)
    stdin_open: true
    tty: true

volumes:
  claude_config:
